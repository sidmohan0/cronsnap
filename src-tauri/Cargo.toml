[package]
name = "cronsnap"
version = "0.1.0"
description = "Local-first activity sampler and archive"
authors = ["Sid Mohan"]
edition = "2021"

[lib]
name = "cronsnap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.5", features = ["tray-icon", "image-png"] }
